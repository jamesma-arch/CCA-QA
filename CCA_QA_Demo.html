const originalText = new WeakMap();
let currentLanguage='en';
try { currentLanguage=localStorage.getItem('cca-qa-language')==='th'?'th':'en'; } catch {}
function translated(text,lang=currentLanguage){
 const trimmed=text.trim(),suffix=trimmed.endsWith(' *')?' *':'';
 const key=suffix?trimmed.slice(0,-2):trimmed;
 if(lang==='en')return text;
 let result=TH[key];
 if(!result&&/^\d+ activit(?:y|ies) available$/.test(key))result='มีกิจกรรม '+key.split(' ')[0]+' รายการ';
 if(!result&&/^Previous QA: [1-5]\/5$/.test(key))result=key.replace('Previous QA:','คะแนนคุณภาพเดิม:');
 if(!result&&/^[1-5] out of 5$/.test(key))result=key[0]+' จาก 5 คะแนน';
 return result ? text.replace(trimmed,result+suffix):text;
}
function toggleLanguage(){currentLanguage=currentLanguage==='en'?'th':'en';try{localStorage.setItem('cca-qa-language',currentLanguage)}catch{}translatePage();}
const observer = new MutationObserver(()=>translatePage());
function translatePage(){
 observer.disconnect();
 const selections=[...document.querySelectorAll('select')].map(element=>({element,value:element.value}));
 document.documentElement.lang=currentLanguage==='th'?'th':'en-GB';
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 let node;
 while((node=walker.nextNode())){
  if(node.parentElement.closest('script,style,textarea,[data-user-content]'))continue;
  let record=originalText.get(node);
  if(!record||node.textContent!==record.rendered)record={source:node.textContent};
  record.rendered=translated(record.source);if(node.textContent!==record.rendered)node.textContent=record.rendered;
  originalText.set(node,record);
 }
 for(const element of document.querySelectorAll('[placeholder],[aria-label]')){
  for(const attr of ['placeholder','aria-label']){
   if(!element.hasAttribute(attr))continue;
   const key='data-original-'+attr;
   if(!element.hasAttribute(key))element.setAttribute(key,element.getAttribute(attr));
   const value=translated(element.getAttribute(key));if(value!==element.getAttribute(attr))element.setAttribute(attr,value);
  }
 }
 for(const button of document.querySelectorAll('[data-action="language"]')){
  button.setAttribute('aria-label',currentLanguage==='th'?'Switch to English':'เปลี่ยนเป็นภาษาไทย');
  button.setAttribute('aria-pressed',String(currentLanguage==='th'));
 }
 for(const {element,value} of selections)if(element.value!==value)element.value=value;
 observer.observe(document.body,{childList:true,subtree:true,characterData:true});
}
translatePage();

const options=(items,current)=>items.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('');
const brand=()=>`<div class="brand"><div class="monogram" aria-hidden="true">H</div><div><strong>HARROW BANGKOK</strong><small>CCA · Quality Assurance</small></div></div>`;
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',4500)}
async function api(action,body){throw Error('This is the offline demo. Choose Explore the demo; use the deployed app to sign in.');const r=await fetch('/.netlify/functions/api?action='+action,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let result;try{result=await r.json()}catch{throw Error('The shared service is unavailable. Use the demo to preview, or check the Netlify setup.')}if(!r.ok){if(r.status===401&&action!=='login'){state.role=null;render()}throw Error(result.error||'Unable to complete request.')}return result}
function err(form,msg){let e=form.querySelector('.error');if(!e){e=document.createElement('div');e.className='error';e.setAttribute('role','alert');form.append(e)}e.textContent=msg;e.scrollIntoView({block:'nearest'})}
async function refresh(){if(state.demo)return;const data=await api('data');Object.assign(state,data)}
function shell(content){return `<header>${brand()}<div class="header-actions"><button class="language-switch secondary" data-action="language" aria-label="เปลี่ยนเป็นภาษาไทย">English / ไทย</button><span>${state.role==='admin'?'CCA administrator':'Staff access'}</span><button class="secondary" data-action="logout">${state.demo?'Exit demo':'Sign out'}</button></div></header><main class="wrap">${state.demo?'<div class="demo-banner"><strong>Demo mode</strong> · Try the forms and admin tools. Changes last for this session only and are not shared with staff.</div>':''}${content}<footer>Harrow Bangkok · Co-Curricular Activities</footer></main>`}
function login(){app.innerHTML=`<main class="login"><button class="language-switch login-language secondary" data-action="language" aria-label="เปลี่ยนเป็นภาษาไทย">English / ไทย</button><section class="login-left">${brand()}<div><div class="eyebrow">Provider quality assurance</div><h1>Every observation.<br>A better experience.</h1><div class="intro-rule"></div><p>Record what is working, identify support needed and keep our CCA provision moving forward.</p></div><p class="login-note">For Harrow Bangkok staff<br>Lower School & Upper School</p></section><section class="login-right"><div class="login-card"><div class="eyebrow">Staff portal</div><h2>Welcome back</h2><p class="muted">Enter your staff or administrator access code.</p><form id="login-form"><div class="field"><label for="access-code">Access code</label><input id="access-code" name="code" type="password" required autocomplete="current-password" maxlength="200"></div><button>Sign in</button></form><p class="login-foot muted">Contact the CCA team if you need access.</p><button class="secondary" data-action="demo">Explore the demo</button></div></section></main>`;document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{Object.assign(state,await api('login',{code:e.target.code.value}));await refresh();render()}catch(error){err(e.target,error.message)}finally{button.disabled=false}}}
function render(){if(!state.role)return login();if(state.selected)return observation();const tabs=`<nav class="tabs" aria-label="Main navigation"><button data-tab="activities" class="${state.tab==='activities'?'active':''}">Activities</button>${state.role==='admin'?`<button data-tab="reviews" class="${state.tab==='reviews'?'active':''}">Observations & actions</button><button data-tab="manage" class="${state.tab==='manage'?'active':''}">Manage activities</button>`:''}</nav>`;app.innerHTML=shell(`<div class="title-row"><div><div class="eyebrow">Co-curricular provision</div><h1>${state.tab==='activities'?'CCA quality assurance':state.tab==='reviews'?'Observations & actions':'Activity directory'}</h1><p class="muted">${state.tab==='activities'?'Choose an activity to record your provider observation.':state.tab==='reviews'?'Review feedback and track the next steps.':'Keep the information staff see up to date.'}</p></div><div class="actions"><button class="secondary" data-action="refresh">Refresh</button>${state.tab==='manage'?'<button class="gold" data-action="add">Add activity</button>':''}${state.tab==='reviews'?'<button class="secondary" data-action="export">Export CSV</button><button class="secondary" data-action="print">Print summaries</button>':''}</div></div>${tabs}${state.tab==='activities'?activityView():state.tab==='reviews'?reviewView():manageView()}`);bindFilters();for(const el of document.querySelectorAll('[data-status]'))el.value=state.reviews.find(r=>r.id===el.dataset.status).status;}
function activityView(){return `<div class="toolbar"><div><label for="search">Find an activity or provider</label><input id="search" placeholder="Search activities, providers or year groups" value="${esc(state.query)}"></div><div><label for="school">School</label><select id="school">${options(['All schools','Lower School','Upper School'],state.school)}</select></div><div><label for="day">Day</label><select id="day">${options(['All days',...DAY],state.day)}</select></div></div><div id="activity-results">${activityResults()}</div>`}
function activityResults(){const list=state.activities.filter(a=>a.active&&(state.school==='All schools'||a.school===state.school)&&(state.day==='All days'||a.day===state.day)&&`${a.title} ${a.provider} ${a.years}`.toLowerCase().includes(state.query.toLowerCase()));return `<p class="muted hint">${list.length} ${list.length===1?'activity':'activities'} available</p><div class="grid">${list.map(a=>`<article class="panel activity"><div class="badges"><span class="badge">${esc(a.school)}</span><span class="badge">${esc(a.years)}</span></div><h2>${esc(a.title)}</h2><div class="provider">${esc(a.provider)}</div><dl><div><dt>Day</dt><dd>${esc(a.day)}</dd></div><div><dt>Room / location</dt><dd>${esc(a.room)||'Not set'}</dd></div><div><dt>Season</dt><dd>${esc(a.season)}</dd></div><div><dt>School lead</dt><dd>${esc(a.lead)||'Not set'}</dd></div></dl><button data-observe="${esc(a.id)}">Record observation</button></article>`).join('')}</div>${!list.length?'<div class="panel empty"><h2>No matching activities</h2><p>Try another search or ask the CCA administrator to add the activity.</p></div>':''}`}
function bindFilters(){for(const key of ['search','school','day','review-filter']){const el=document.getElementById(key);if(el)el.addEventListener(key==='search'?'input':'change',()=>{state[key==='search'?'query':key==='review-filter'?'reviewFilter':key]=el.value;if(key==='review-filter')render();else document.getElementById('activity-results').innerHTML=activityResults()})}}
function field(label,name,value='',type='text',required=false){return `<div class="field"><label for="${name}">${label}${required?' *':''}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${name==='reviewer'||name==='owner'||name==='sessions'?100:3000}"></div>`}
function area(label,name,value='',required=false){return `<div class="field"><label for="${name}">${label}${required?' *':''}</label><textarea id="${name}" name="${name}" maxlength="5000" ${required?'required':''}>${esc(value)}</textarea></div>`}
function observation(){const a=state.activities.find(x=>x.id===state.selected);if(!a){state.selected=null;return render()}app.innerHTML=shell(`<div class="title-row"><div><button class="quiet" data-action="back">Back to activities</button><h1>Provider observation</h1><p class="muted">A short drop-in, a clear record, useful next steps.</p></div><span class="badge">${esc(a.season)}</span></div><div class="observation"><aside class="panel context-card"><div class="badges"><span class="badge">${esc(a.school)}</span><span class="badge">${esc(a.years)}</span></div><h2 class="section">${esc(a.title)}</h2><p class="muted">${esc(a.provider)}</p><dl>${[['Day',a.day],['Room / location',a.room],['School lead',a.lead],['Provider contact',a.contact],['Review stage',date(a.reviewStage)],['Sessions observed',a.sessionsObserved]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)||'Not set'}</dd></div>`).join('')}</dl>${a.baselineScore?`<div class="badges"><span class="badge">Previous QA: ${a.baselineScore}/5</span>${a.baselinePriority?'<span class="badge red">Priority</span>':''}</div>`:''}${[['Strengths already identified',a.strengths],['Improvement priorities',a.priorities],['Existing follow-up / context',a.context]].map(([k,v])=>`<div class="note"><h3>${k}</h3><p data-user-content>${esc(v)||'No information recorded'}</p></div>`).join('')}</aside><form id="review-form" class="panel"><div class="eyebrow">New observation</div><h2>Your review of the session</h2><p class="hint">Fields marked * are required. Keep comments focused on provider practice and avoid pupil names.</p><div class="two">${field('Your name','reviewer','','text',true)}${field('Observation date','date',today(),'date',true)}</div>${field('Sessions observed during this visit','sessions','','text')}<section class="section"><h3>Quick drop-in checklist</h3><p>Select observed, needs attention or not observed for each point.</p><details class="choice-help"><summary>How to choose</summary><p>Observed: you saw this working well. Needs attention: you saw a gap or concern. Not observed / N/A: you did not see it during your visit, or it does not apply.</p></details>${CHECKS.map((c,i)=>`<div class="check-row"><div class="check-label"><label for="check${i}">${c}</label><button type="button" class="info-button" data-info="${i}" aria-label="More information" aria-expanded="false" aria-controls="help${i}">i</button></div><select id="check${i}" name="check${i}" required><option value="">Select…</option><option value="yes">Observed</option><option value="no">Needs attention</option><option value="na">Not observed / N/A</option></select><div id="help${i}" class="check-help" hidden><h4>What to look for</h4><p>${esc(HELP[i][0])}</p><h4>Example</h4><p>${esc(HELP[i][1])}</p></div></div>`).join('')}</section><section class="section"><h3>Overall QA score *</h3><div class="score-options">${[1,2,3,4,5].map(i=>`<label><input type="radio" name="score" value="${i}" required aria-label="${i} out of 5"><span>${i}</span></label>`).join('')}</div><div class="scale"><span>1 · Significant improvement needed</span><span>5 · Excellent provision</span></div><p class="hint">2: improvement needed · 3: meets expectations · 4: strong provision</p></section><section class="section">${area('Strengths seen during this visit','strengths')}${area('Your review of the session','review','',true)}<div class="field"><label for="priority">Follow-up level *</label><select id="priority" name="priority">${options(['Routine','Follow-up','Urgent'],'Routine')}</select></div><p class="hint">For an immediate safeguarding concern, follow the school reporting procedure straight away.</p>${area('Actions taken / next steps','nextSteps')}<div class="two">${field('Action owner','owner')}${field('Review / action due date','due','','date')}</div></section><div class="submit-row"><span class="hint">${state.demo?'Demo observation · not saved to the shared app':'Submitted observations go to the CCA administrator.'}</span><button class="gold">Submit observation</button></div></form></div>`);document.querySelector('#priority').onchange=e=>{document.querySelector('#nextSteps').required=e.target.value!=='Routine'};document.querySelector('#review-form').onsubmit=submitReview}
async function submitReview(e){e.preventDefault();const f=e.target,b=Object.fromEntries(new FormData(f));b.checklist=CHECKS.map((_,i)=>b['check'+i]);b.score=Number(b.score);b.activityId=state.selected;const button=f.querySelector('button');button.disabled=true;try{if(state.demo){state.reviews.push({...b,id:crypto.randomUUID(),activitySnapshot:state.activities.find(a=>a.id===b.activityId),status:'Open',createdAt:new Date().toISOString()})}else await api('review',b);state.selected=null;app.innerHTML=shell(`<section class="panel success"><div class="success-icon">✓</div><div class="eyebrow">Observation complete</div><h1>${state.demo?'Demo observation submitted':'Thank you for your feedback'}</h1><p class="muted">${state.demo?'This observation is available in the demo dashboard for this session.':'Your observation has been saved and is available to the CCA administrator.'}</p><button data-action="back">Return to activities</button></section>`)}catch(error){err(f,error.message);button.disabled=false}}
function reviewView(){const follow=state.reviews.filter(r=>r.priority!=='Routine'&&r.status!=='Closed'),average=state.reviews.length?(state.reviews.reduce((s,r)=>s+r.score,0)/state.reviews.length).toFixed(1):'—';const list=state.reviews.filter(r=>state.reviewFilter==='All observations'||state.reviewFilter==='Open follow-up'&&r.priority!=='Routine'&&r.status!=='Closed'||state.reviewFilter==='Urgent'&&r.priority==='Urgent'||state.reviewFilter==='Closed'&&r.status==='Closed').sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class="stats">${[['Observations',state.reviews.length],['Average QA score',average==='—'?average:average+'/5'],['Open follow-up',follow.length],['Activities reviewed',new Set(state.reviews.map(r=>r.activityId)).size]].map(([k,v])=>`<div class="panel stat"><label>${k}</label><strong>${v}</strong></div>`).join('')}</div><div class="field"><label for="review-filter">Show</label><select id="review-filter">${options(['All observations','Open follow-up','Urgent','Closed'],state.reviewFilter)}</select></div>${list.map(r=>`<article class="panel review-card"><div class="review-head"><div><div class="badges"><span class="badge ${r.priority==='Urgent'?'red':''}">${esc(r.priority)}</span><span class="badge ${r.status==='Closed'?'green':''}">${esc(r.status)}</span><span class="badge">${esc(r.activitySnapshot.school)}</span></div><h2>${esc(r.activitySnapshot.title)} (${esc(r.activitySnapshot.years)})</h2><p class="review-meta">${esc(r.activitySnapshot.provider)} · ${date(r.date)} · ${esc(r.reviewer)}</p></div><div class="small-score">${r.score}/5</div></div><p data-user-content>${esc(r.review)}</p>${r.nextSteps?`<div class="note"><h3>Actions / next steps</h3><p data-user-content>${esc(r.nextSteps)}</p><p class="review-meta">Owner: ${esc(r.owner)||'Not assigned'} · Due: ${date(r.due)}</p></div>`:''}<div class="review-tools"><label for="status-${r.id}">Action status</label><select id="status-${r.id}" data-status="${r.id}">${options(['Open','In progress','Closed'],r.status)}</select></div><details><summary>Full observation details</summary><div class="review-body"><div class="three">${[['Day',r.activitySnapshot.day],['Room',r.activitySnapshot.room],['School lead',r.activitySnapshot.lead],['Season',r.activitySnapshot.season],['Provider contact',r.activitySnapshot.contact],['Sessions observed',r.sessions]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)||'Not set'}</dd></div>`).join('')}</div><h3 class="section">Strengths seen</h3><p data-user-content>${esc(r.strengths)||'None recorded'}</p><h3>Drop-in checklist</h3>${CHECKS.map((c,i)=>`<div class="check-row"><span>${c}</span><span class="badge ${r.checklist[i]==='no'?'red':r.checklist[i]==='yes'?'green':''}">${{yes:'Observed',no:'Needs attention',na:'Not observed / N/A'}[r.checklist[i]]}</span></div>`).join('')}<h3 class="section">Context at time of observation</h3><p>Existing strengths: ${esc(r.activitySnapshot.strengths)||'None recorded'}<br>Improvement priorities: ${esc(r.activitySnapshot.priorities)||'None recorded'}<br>Follow-up / context: ${esc(r.activitySnapshot.context)||'None recorded'}</p></div></details></article>`).join('')}${!list.length?'<div class="panel empty"><h2>No observations yet</h2><p>Submitted staff observations will appear here.</p></div>':''}`}
function manageView(){return `<div class="panel"><h2>Outside-provider activities</h2><p class="muted">Add each activity once. Staff see these details alongside their feedback form.</p><div class="admin-list">${state.activities.map(a=>`<div class="admin-item section"><div><strong>${esc(a.title)} (${esc(a.years)})</strong><p>${esc(a.provider)} · ${esc(a.day)} · ${esc(a.season)} · ${esc(a.school)} ${!a.active?'· Archived':''}</p></div><button class="secondary" data-edit="${a.id}">Edit details</button></div>`).join('')}</div></div>`}
function editActivity(id){const a=state.activities.find(x=>x.id===id)||{};modal.innerHTML=`<div class="modal-head"><div><div class="eyebrow">Activity directory</div><h2>${id?'Edit activity':'Add activity'}</h2></div><button class="quiet" data-action="close" aria-label="Close">✕</button></div><form id="activity-form"><div class="two">${field('Activity name','title',a.title,'text',true)}${field('Year groups','years',a.years,'text',true)}</div><div class="two"><div class="field"><label for="school-edit">School *</label><select id="school-edit" name="school">${options(['Lower School','Upper School'],a.school)}</select></div><div class="field"><label for="day-edit">Day *</label><select id="day-edit" name="day">${options(DAY,a.day)}</select></div></div><div class="two">${field('Provider','provider',a.provider,'text',true)}${field('Provider contact','contact',a.contact)}${field('School lead','lead',a.lead)}${field('Room / location','room',a.room)}${field('Season','season',a.season,'text',true)}${field('Review stage date','reviewStage',a.reviewStage,'date')}${field('Sessions observed to date','sessionsObserved',a.sessionsObserved)}</div>${area('Strengths already identified','strengths',a.strengths)}${area('Improvement priorities','priorities',a.priorities)}${area('Existing follow-up / context','context',a.context)}<div class="field"><label for="active">Availability</label><select id="active" name="active"><option value="true" ${a.active!==false?'selected':''}>Active — visible to staff</option><option value="false" ${a.active===false?'selected':''}>Archived — hide from staff</option></select></div><button class="gold">Save activity</button></form>`;modal.showModal();document.querySelector('#activity-form').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.active=b.active==='true';b.id=id;const button=e.target.querySelector('button');button.disabled=true;try{if(state.demo){const item={...b,id:id||crypto.randomUUID()};state.activities=state.activities.filter(x=>x.id!==id).concat(item)}else{await api('activity',b);await refresh()}modal.close();render();toast('Activity details saved')}catch(error){err(e.target,error.message);button.disabled=false}}}
function exportCsv(){if(!state.reviews.length)return toast('There are no observations to export yet.');const headings=['Activity','Year groups','School','Provider','Day','Room','Season','School lead','Contact','Reviewer','Observation date','Sessions observed','QA score','Priority','Strengths seen','Session review','Next steps','Action owner','Due date','Status',...CHECKS];const rows=state.reviews.map(r=>{const a=r.activitySnapshot;return [a.title,a.years,a.school,a.provider,a.day,a.room,a.season,a.lead,a.contact,r.reviewer,r.date,r.sessions,r.score,r.priority,r.strengths,r.review,r.nextSteps,r.owner,r.due,r.status,...r.checklist.map(v=>({yes:'Observed',no:'Needs attention',na:'Not observed / N/A'}[v]))]});const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'</body>").replace(/"/g,'""')+'"';const blob=new Blob(['\uFEFF'+[headings,...rows].map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='CCA_QA_observations_'+today()+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='language')return toggleLanguage();if(b.dataset.info!==undefined){const help=document.getElementById('help'+b.dataset.info);help.hidden=!help.hidden;b.setAttribute('aria-expanded',String(!help.hidden));return}if(b.dataset.tab){state.tab=b.dataset.tab;return render()}if(b.dataset.observe){state.selected=b.dataset.observe;return observation()}if(b.dataset.edit)return editActivity(b.dataset.edit);if(action==='close')return modal.close();if(action==='add')return editActivity();if(action==='back'){state.selected=null;return render()}if(action==='export')return exportCsv();if(action==='print'){document.querySelectorAll('details').forEach(d=>d.open=true);return window.print()}if(action==='demo'){try{const seed=[{"id":"codey-rocky-y2-y3","title":"Fun Robotics & Coding with Codey Rocky","years":"Y2–Y3","school":"Lower School","day":"Monday","lead":"Sansuda Thamronglaohapan","room":"I108","season":"Season 2","reviewStage":"2026-04-03","sessionsObserved":"1–2","provider":"Kiddee Lab","contact":"Khun Mod/Tom","strengths":"Smooth transitions; well suited to age group","priorities":"No major concerns","context":"No","baselineScore":3,"baselinePriority":true,"active":true}]
;state={...state,role:'admin',demo:true,activities:structuredClone(seed),reviews:[],selected:null,tab:'activities'};render()}catch{toast('Demo data could not be loaded.')}return}if(action==='logout'){if(state.selected&&!confirm(translated('Leave this observation without submitting it?')))return;try{if(!state.demo)await api('logout',{});state={...state,role:null,demo:false,selected:null,reviews:[],activities:[],tab:'activities'};render()}catch(error){toast(error.message)}}if(action==='refresh'){b.disabled=true;try{await refresh();render();toast(state.demo?'Demo is up to date':'Latest records loaded')}catch(error){toast(error.message);b.disabled=false}}});
document.addEventListener('change',async e=>{if(!e.target.dataset.status)return;const id=e.target.dataset.status,status=e.target.value,old=state.reviews.find(r=>r.id===id).status;e.target.disabled=true;try{if(!state.demo)await api('status',{id,status});state.reviews.find(r=>r.id===id).status=status;render();toast('Action status updated')}catch(error){e.target.value=old;e.target.disabled=false;toast(error.message)}});
window.addEventListener('beforeunload',e=>{if(state.selected){e.preventDefault();e.returnValue=''}});
login();
</script></body></html>
